[package]
name = "RustCraft"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = {version = "0.19.0",  features = ["dynamic_linking", "bevy_dev_tools"] }
bevy_rapier3d = "0.35.0"
bevy_voxel_world = "0.17.0"
block-mesh = "0.2.0"
noise = "0.9.0"
rand = "0.10.2"


# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
